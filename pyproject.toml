[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scGSHAPA"
version = "0.2.0"
authors = [
  { name="Sara Khademioureh", email="khademio@ualberta.ca" },
  { name="Sergio Peignier", email="sergio.peignier@insa-lyon.fr" },
]
description = "scGSHAPA: SHAP-based gene set and gene-level analysis for single-cell transcriptomics"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["Gene Set Analysis", "SHAP values", "Random Forest", "Differential Expression"]
dependencies = [
    "scikit-learn",
    "xgboost",
    "pandas",
    "numpy<2",  # fasttreeshap (latest 0.1.6) calls np.obj2sctype, removed in NumPy 2.0
    "tqdm",
    "statsmodels",
    "fasttreeshap",
    "shap",
    "torch",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/SKhademi/scGSHAPA"
Issues = "https://github.com/SKhademi/scGSHAPA/issues"

[tool.hatch.build.targets.wheel]
packages = ["scGSHAPA"]
